name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Version comes from the `packageManager` field in package.json.

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run all three even when an earlier one fails: three separate failures in
      # one run beat three pushes to find them one at a time.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      # Engine, seed-diff and fixture tests are pure — no DATABASE_URL, no
      # network. Anything needing a live database belongs in its own workflow.
      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test
